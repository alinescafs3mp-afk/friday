# Development and build dependency closure, pinned on the same Python 3.14
# environment as requirements.lock.  Runtime packages stay in requirements.lock;
# install the project with BOTH constraint files so test/build tooling cannot float.
#
# Install:
#   python -m pip install --upgrade --constraint requirements-dev.lock pip setuptools wheel
#   python -m pip install --constraint requirements.lock \
#     --constraint requirements-dev.lock --no-build-isolation -e ".[dev]"
