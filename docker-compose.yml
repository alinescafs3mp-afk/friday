name: jericho

# Everything a person may configure arrives through `env_file: .env` on the two
# services below — see the comment there. This map is NOT that list: it is the
# short list of keys the CONTAINER owns and a host `.env` must never win, because
# they name paths that only exist inside it or that the volume map provides.
x-backend-environment: &backend-environment
  FRIDAY_HOME: /runtime
  FRIDAY_DATA_DIR: /runtime/data
  FRIDAY_CACHE_DIR: /runtime/cache
  FRIDAY_LOG_DIR: /runtime/logs
  FRIDAY_MODEL_ROOT: /runtime/models
  FRIDAY_STATE_DIR: /runtime/data/state
  FRIDAY_DATABASE_PATH: /runtime/data/state/friday.sqlite3
  FRIDAY_FILES_DIR: /runtime/data/files
  FRIDAY_MEMORY_VAULT_DIR: /runtime/data/memory-vault
  FRIDAY_BACKUPS_DIR: /runtime/data/backups
  FRIDAY_EXPORTS_DIR: /runtime/data/exports
  FRIDAY_WHISPER_DOWNLOAD_ROOT: /runtime/cache/whisper
  # The container has no `.env` of its own (both are in .dockerignore) and must not
  # go looking for one on a path inherited from the host.
  FRIDAY_ENV_FILE: ""
  FRIDAY_PROFILE: ${FRIDAY_PROFILE:-qwen36-vl}
  FRIDAY_LLM_BASE_URL: ${FRIDAY_DOCKER_LLM_BASE_URL:-http://dispatcher:8001/v1}
  FRIDAY_LLM_MODEL: ${FRIDAY_LLM_MODEL:-dispatcher}
  FRIDAY_LLM_ENABLED: ${FRIDAY_LLM_ENABLED:-1}
  FRIDAY_LLM_TIMEOUT_SEC: ${FRIDAY_LLM_TIMEOUT_SEC:-240}
  FRIDAY_LLM_MAX_TOKENS: ${FRIDAY_LLM_MAX_TOKENS:-2048}
  FRIDAY_VERIFY_ANSWERS: ${FRIDAY_VERIFY_ANSWERS:-1}
  FRIDAY_EMBEDDINGS_ENABLED: ${FRIDAY_EMBEDDINGS_ENABLED:-0}
  FRIDAY_EMBEDDINGS_BASE_URL: ${FRIDAY_DOCKER_EMBEDDINGS_BASE_URL:-http://dispatcher:8001/v1}
  FRIDAY_EMBEDDINGS_MODEL: ${FRIDAY_EMBEDDINGS_MODEL:-}
  FRIDAY_API_HOST: 0.0.0.0
  FRIDAY_API_PORT: ${FRIDAY_API_PORT:-8000}
  FRIDAY_API_TOKEN: ${FRIDAY_API_TOKEN:?set FRIDAY_API_TOKEN in .env}
  FRIDAY_API_REQUIRE_TOKEN_ON_LOOPBACK: "1"
  # Base Compose keeps backend↔bridge on the private Docker HTTP network. Native
  # TLS needs a backend-only private-key mount, which this shared environment must
  # never grant to the Telegram container; terminate external TLS at a proxy.
  FRIDAY_SSL_CERTFILE: ""
  FRIDAY_SSL_KEYFILE: ""
  FRIDAY_BACKEND_CA_FILE: ""
  FRIDAY_API_USER_RATE_LIMIT_PER_MINUTE: ${FRIDAY_API_USER_RATE_LIMIT_PER_MINUTE:-240}
  FRIDAY_TRUST_PROXY_HEADERS: ${FRIDAY_TRUST_PROXY_HEADERS:-0}
  FRIDAY_TRUSTED_PROXY_NETWORKS: ${FRIDAY_TRUSTED_PROXY_NETWORKS:-127.0.0.1/32,::1/128}
  FRIDAY_TELEGRAM_BRIDGE_SECRET: ${FRIDAY_TELEGRAM_BRIDGE_SECRET:?set FRIDAY_TELEGRAM_BRIDGE_SECRET in .env}
  FRIDAY_TELEGRAM_REALM_ID: ${FRIDAY_TELEGRAM_REALM_ID:-telegram}
  FRIDAY_TELEGRAM_ALLOWED_CHAT_IDS: ${FRIDAY_TELEGRAM_ALLOWED_CHAT_IDS:-}
  FRIDAY_TELEGRAM_OWNER_CHAT_IDS: ${FRIDAY_TELEGRAM_OWNER_CHAT_IDS:-}
  FRIDAY_TELEGRAM_SIGNATURE_MAX_AGE_SEC: ${FRIDAY_TELEGRAM_SIGNATURE_MAX_AGE_SEC:-90}
  FRIDAY_TELEGRAM_USER_RATE_LIMIT_PER_MINUTE: ${FRIDAY_TELEGRAM_USER_RATE_LIMIT_PER_MINUTE:-30}
  FRIDAY_TELEGRAM_GLOBAL_RATE_LIMIT_PER_MINUTE: ${FRIDAY_TELEGRAM_GLOBAL_RATE_LIMIT_PER_MINUTE:-1200}
  # Empty lets Friday derive origins with the actual HTTP/HTTPS scheme and port.
  FRIDAY_CORS_ORIGINS: ${FRIDAY_CORS_ORIGINS:-}
  FRIDAY_AUTONOMY_ENABLED: ${FRIDAY_AUTONOMY_ENABLED:-1}
  FRIDAY_OPERATOR_FULL_AUTONOMY: ${FRIDAY_OPERATOR_FULL_AUTONOMY:-0}
  FRIDAY_COGNITION_ENABLED: ${FRIDAY_COGNITION_ENABLED:-1}
  FRIDAY_COGNITION_INTERVAL_SEC: ${FRIDAY_COGNITION_INTERVAL_SEC:-300}
  FRIDAY_COGNITION_MAX_TOKENS: ${FRIDAY_COGNITION_MAX_TOKENS:-512}
  FRIDAY_EXECUTIVE_MAX_ACTIVE_MISSIONS: ${FRIDAY_EXECUTIVE_MAX_ACTIVE_MISSIONS:-8}
  FRIDAY_EXECUTIVE_MAX_TASKS_PER_MISSION: ${FRIDAY_EXECUTIVE_MAX_TASKS_PER_MISSION:-12}
  FRIDAY_EXECUTIVE_TASK_TOOL_BUDGET: ${FRIDAY_EXECUTIVE_TASK_TOOL_BUDGET:-6}
  FRIDAY_EXECUTIVE_TICK_INTERVAL_SEC: ${FRIDAY_EXECUTIVE_TICK_INTERVAL_SEC:-15}
  FRIDAY_WORKERS_ENABLED: ${FRIDAY_WORKERS_ENABLED:-1}
  FRIDAY_CODE_EXECUTION_ENABLED: ${FRIDAY_CODE_EXECUTION_ENABLED:-0}
  FRIDAY_CODE_EXECUTION_TIMEOUT_SEC: ${FRIDAY_CODE_EXECUTION_TIMEOUT_SEC:-15}
  FRIDAY_CODE_EXECUTION_MAX_OUTPUT_BYTES: ${FRIDAY_CODE_EXECUTION_MAX_OUTPUT_BYTES:-65536}
  FRIDAY_WEB_ALLOW_PRIVATE_NETWORKS: ${FRIDAY_WEB_ALLOW_PRIVATE_NETWORKS:-0}
  FRIDAY_WEB_MAX_RESPONSE_BYTES: ${FRIDAY_WEB_MAX_RESPONSE_BYTES:-5242880}
  FRIDAY_MAX_UPLOAD_BYTES: ${FRIDAY_MAX_UPLOAD_BYTES:-52428800}
  FRIDAY_MAX_EXTRACTED_TEXT_CHARS: ${FRIDAY_MAX_EXTRACTED_TEXT_CHARS:-2000000}
  FRIDAY_MAX_ARCHIVE_ENTRIES: ${FRIDAY_MAX_ARCHIVE_ENTRIES:-500}
  FRIDAY_MAX_ARCHIVE_UNCOMPRESSED_BYTES: ${FRIDAY_MAX_ARCHIVE_UNCOMPRESSED_BYTES:-262144000}
  FRIDAY_BRAVE_SEARCH_API_KEY: ${FRIDAY_BRAVE_SEARCH_API_KEY:-}
  FRIDAY_TAVILY_API_KEY: ${FRIDAY_TAVILY_API_KEY:-}
  FRIDAY_SERPER_API_KEY: ${FRIDAY_SERPER_API_KEY:-}

x-backend-volumes: &backend-volumes
  - type: bind
    source: ${FRIDAY_HOST_HOME:-D:/jericho}/data
    target: /runtime/data
  - type: bind
    source: ${FRIDAY_HOST_HOME:-D:/jericho}/cache
    target: /runtime/cache
  - type: bind
    source: ${FRIDAY_HOST_HOME:-D:/jericho}/logs
    target: /runtime/logs
  - type: bind
    source: ${FRIDAY_MODEL_ROOT:-D:/friday/models}
    target: /runtime/models
    read_only: true

services:
  dispatcher:
    profiles: ["llm"]
    build:
      context: .
      dockerfile: docker/vllm-asyncio/Dockerfile
    image: ${FRIDAY_VLLM_IMAGE:-friday/vllm-openai:v0.25.1-asyncio-e4f88a8}
    container_name: jericho-dispatcher
    restart: unless-stopped
    ipc: host
    command: >-
      --model /models/qwen3.6-35b-a3b-nvfp4
      --served-model-name ${FRIDAY_LLM_MODEL:-dispatcher}
      --dtype auto
      ${FRIDAY_QWEN_QUANT_ARGS:-}
      ${FRIDAY_QWEN_ENFORCE_EAGER:-}
      --max-model-len 32768
      --gpu-memory-utilization 0.90
      --kv-cache-dtype fp8
      --tokenizer-mode auto
      --safetensors-load-strategy prefetch
      --enable-prefix-caching
      --max-num-seqs 16
      --skip-mm-profiling
      --mm-processor-cache-gb 4.0
      --max-num-batched-tokens 4096
      --limit-mm-per-prompt '{"image":4,"video":1}'
      ${FRIDAY_QWEN_EXTRA_ARGS:-}
      --host 0.0.0.0
      --port 8001
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      VLLM_USE_V2_MODEL_RUNNER: ${VLLM_USE_V2_MODEL_RUNNER:-0}
      VLLM_WEIGHT_OFFLOADING_DISABLE_UVA: ${VLLM_WEIGHT_OFFLOADING_DISABLE_UVA:-1}
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      CUDA_DEVICE_ORDER: ${CUDA_DEVICE_ORDER:-PCI_BUS_ID}
      CUDA_DISABLE_P2P: ${CUDA_DISABLE_P2P:-1}
      NCCL_P2P_DISABLE: ${NCCL_P2P_DISABLE:-1}
    volumes:
      - type: bind
        source: ${FRIDAY_MODEL_ROOT:-D:/friday/models}
        target: /models
        read_only: true
      - type: bind
        source: ${FRIDAY_HOST_HOME:-D:/jericho}/cache
        target: /root/.cache
    ports:
      - "127.0.0.1:8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 40
      start_period: 600s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: jericho-backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    ports:
      - "${FRIDAY_API_BIND_ADDRESS:-127.0.0.1}:${FRIDAY_API_PORT:-8000}:${FRIDAY_API_PORT:-8000}"
    env_file:
      - path: .env
        required: false
    # `.env` reaches the containers here, not through the map above. Compose reads
    # `.env` for `${...}` interpolation only, so every setting the operator wrote in
    # the file README tells them to copy was silently discarded on the Docker path —
    # FRIDAY_TELEGRAM_PROXY among them, which is the whole point of the setting when
    # Telegram is only reachable through a tunnel. Keys in `environment:` still win,
    # so the container-owned paths above cannot be overridden from the host.
    environment: *backend-environment
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes: *backend-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${FRIDAY_API_PORT:-8000}/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  telegram:
    profiles: ["telegram"]
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: jericho-telegram
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    command: ["jericho", "telegram-bridge"]
    # `.env` reaches the containers here, not through the map above. Compose reads
    # `.env` for `${...}` interpolation only, so every setting the operator wrote in
    # the file README tells them to copy was silently discarded on the Docker path —
    # FRIDAY_TELEGRAM_PROXY among them, which is the whole point of the setting when
    # Telegram is only reachable through a tunnel. Keys in `environment:` still win,
    # so the container-owned paths above cannot be overridden from the host.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-environment
      FRIDAY_BACKEND_URL: http://backend:${FRIDAY_API_PORT:-8000}
      FRIDAY_TELEGRAM_BOT_TOKEN: ${FRIDAY_TELEGRAM_BOT_TOKEN:?set FRIDAY_TELEGRAM_BOT_TOKEN in .env}
      FRIDAY_WORKERS_ENABLED: "0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes: *backend-volumes
    depends_on:
      backend:
        condition: service_healthy
