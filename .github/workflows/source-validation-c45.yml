name: C4-C5 source validation

on:
  push:
    branches: [main]
    paths: [.github/workflows/source-validation-c45.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: friday-c45-source-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
      - name: Reconstruct the exact author-tested source, without publishing
        env:
          GH_SOURCE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/c45-evidence"
          python - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import subprocess
          import urllib.request

          def git(*args, data=None):
              return subprocess.check_output(['/usr/bin/git', *args], input=data)

          repo = 'alinescafs3mp-afk/friday'
          base = '6ad812559f53466b405f88195121857dd69445cd'
          workflow = '.github/workflows/source-validation-c45.yml'
          expected = '57b7eaf584fcdd22ce8b476365159dda9fc64ad4'
          if os.environ['GITHUB_REPOSITORY'] != repo or git('rev-parse', 'HEAD').decode().strip() != os.environ['GITHUB_SHA']:
              raise SystemExit('unexpected source identity')
          git('merge-base', '--is-ancestor', base, 'HEAD')
          git('diff', '--exit-code', base, 'HEAD', '--', '.', ':(exclude)' + workflow)
          git('diff', '--exit-code')
          git('diff', '--cached', '--exit-code')
          packed = b''
          for sha in ('27870a2faf12633289d7a7320184605f4b6abfeb', '2225b2ccf797a3e8b5a8a8778ba8c8829afc38ff'):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_SOURCE_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  value = json.loads(response.read(32769))
              if value.get('encoding') != 'base64' or value.get('size') != 7752:
                  raise SystemExit('invalid source packet')
              piece = base64.b64decode(''.join(value['content'].split()), validate=True)
              if len(piece) != 7752 or hashlib.sha1(b'blob 7752\0' + piece).hexdigest() != sha:
                  raise SystemExit('source packet identity mismatch')
              packed += piece
          decoder = lzma.LZMADecompressor()
          patch = decoder.decompress(packed, max_length=67221)
          if not decoder.eof or decoder.unused_data or len(patch) != 67220 or hashlib.sha256(patch).hexdigest() != '93bf37aff2d69031d65386dc498a83cb460bf74a98357aea49e7922e5a648fbe':
              raise SystemExit('patch integrity mismatch')
          git('apply', '--index', '--check', '-', data=patch)
          git('apply', '--index', '-', data=patch)
          git('rm', '--', workflow)
          git('diff', '--cached', '--check')
          if git('write-tree').decode().strip() != expected:
              raise SystemExit('candidate tree mismatch')
          print('Exact C4/C5 candidate tree:', expected)
          PY
      - name: Install the locked project test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade --constraint requirements-dev.lock pip setuptools wheel
          .venv/bin/python -m pip install --no-build-isolation --constraint requirements.lock --constraint requirements-dev.lock -e '.[dev,vectors]'
      - name: Validate the affected user journeys and unchanged inventory constraints
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m ruff check .
          .venv/bin/python -m mypy friday/organs/coding
          .venv/bin/python -m pytest -q -n 4 \
            tests/test_coding_revision_continuity.py \
            tests/test_coding_mode_surface.py \
            tests/test_coding_extract_transaction.py \
            tests/test_coding_result_export.py \
            tests/test_generated_file_delivery.py \
            tests/test_operation_result_carrier.py \
            tests/test_orchestration_import_boundaries.py \
            tests/test_quality_gate_inventory.py \
            --junitxml="$RUNNER_TEMP/c45-evidence/focused.xml"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'c45-evidence/focused.xml').getroot()
          cases = list(root.iter('testcase'))
          if len(cases) != 167 or any(child.tag in {'skipped', 'failure', 'error'} for case in cases for child in case):
              raise SystemExit('missing or nonpassing focused source cases')
          print('All 167 focused source cases passed; native/release gates are separate.')
          PY
      - name: Store only the checked Git tree; never move a branch
        env:
          GH_TREE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['/usr/bin/git', *args]).decode('utf-8')

          expected = '57b7eaf584fcdd22ce8b476365159dda9fc64ad4'
          if git('write-tree').strip() != expected:
              raise SystemExit('checked tree changed')
          git('diff', '--exit-code')
          trigger = os.environ['GITHUB_SHA']
          entries = []
          for path in git('diff', '--name-only', '--no-renames', '-z', trigger, expected).split('\0'):
              if not path:
                  continue
              row = git('ls-tree', expected, '--', path).strip()
              entry = {'path': path, 'mode': '100644', 'type': 'blob'}
              if row:
                  if not row.startswith('100644 blob '):
                      raise SystemExit('unexpected source mode')
                  entry['content'] = git('show', expected + ':' + path)
              else:
                  entry['sha'] = None
              entries.append(entry)
          payload = json.dumps({'base_tree': git('rev-parse', trigger + '^{tree}').strip(), 'tree': entries}, ensure_ascii=False).encode()
          request = urllib.request.Request(
              'https://api.github.com/repos/alinescafs3mp-afk/friday/git/trees',
              data=payload, method='POST',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TREE_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'},
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              value = json.load(response)
          if value.get('sha') != expected:
              raise SystemExit('stored tree mismatch')
          receipt = {'trigger': trigger, 'source_tree': expected, 'focused_cases_passed': 167, 'canonical_native_gate': 'not_attested', 'independent_review': 'pending', 'branch_updated': False, 'production_deployed': False}
          (Path(os.environ['RUNNER_TEMP']) / 'c45-evidence/source-tree.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Preserve focused source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c45-source-${{ github.sha }}
          path: ${{ runner.temp }}/c45-evidence
          if-no-files-found: warn
          retention-days: 7
