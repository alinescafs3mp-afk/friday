name: Friday corrective C1

on:
  push:
    branches: [main]
    paths: [.github/workflows/friday-corrective-c1.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: friday-corrective-integration
  cancel-in-progress: false

jobs:
  verify-and-integrate:
    if: github.repository == 'alinescafs3mp-afk/friday' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.4'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Install the existing locked validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade --constraint requirements-dev.lock pip setuptools wheel
          .venv/bin/python -m pip install --no-build-isolation --constraint requirements.lock --constraint requirements-dev.lock -e '.[dev,vectors]'
          .venv/bin/python -m playwright install --with-deps chromium
          install -d -m 0700 "$RUNNER_TEMP/c1-evidence"
      - name: Verify exact source and add behavioral regressions
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              'friday/orchestration/current_file_web_comparison.py': '788f63b4f589f0eefbe9f7c72d13b3e982c94d53',
              'friday/orchestration/supervisor_production_baseline.py': '9374e43d6aef4465ae7e4212f4cb13cd623a8e8b',
          }
          for name, digest in expected.items():
              raw = Path(name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if actual != digest:
                  raise SystemExit(f'Unexpected source at {name}; refusing automatic integration.')
          target = Path('tests/test_corrective_c1_reliability.py')
          if target.exists():
              raise SystemExit('Regression path already exists; refusing overwrite.')
          target.write_text('''"""Behavioral regressions for final-output budgets and malformed observations."""

          import json
          import sqlite3

          import pytest

          from friday.orchestration import current_file_web_comparison as comparison
          from friday.orchestration import supervisor_production_baseline as baseline


          def test_citation_normalization_cannot_exceed_final_json_budget() -> None:
              answer = "F1"
              budget = len(json.dumps(answer, ensure_ascii=False).encode("utf-8"))
              with pytest.raises(comparison._AnswerRejected) as raised:  # noqa: PLC2701
                  comparison._validate_answer(answer, ("F1",), max_utf8_bytes=budget)  # noqa: PLC2701
              assert raised.value.code == "json_budget"


          def test_valid_repeated_citations_remain_idempotent() -> None:
              answer = "F1 W1 F1"
              result = comparison._validate_answer(  # noqa: PLC2701
                  answer, ("F1", "W1"), max_utf8_bytes=128
              )
              assert result == "[F1] [W1] [F1]"
              assert comparison._validate_answer(  # noqa: PLC2701
                  result, ("F1", "W1"), max_utf8_bytes=128
              ) == result


          @pytest.mark.parametrize("value", [[], {}, set()])
          def test_unhashable_task_classes_are_unknown(value: object) -> None:
              assert baseline._safe_task_class(value) == "unknown"  # noqa: PLC2701


          def test_invalid_joined_json_is_counted_instead_of_filtered_out() -> None:
              with sqlite3.connect(":memory:") as conn:
                  conn.execute("CREATE TABLE runtime_events (event_type TEXT, payload TEXT)")
                  conn.executemany(
                      "INSERT INTO runtime_events(event_type,payload) VALUES (?,?)",
                      [
                          (baseline.SUPERVISOR_TRACE_EVENT, "{"),
                          (baseline.SUPERVISOR_TRACE_EVENT, "not-json"),
                          ("other.event", "not-json"),
                      ],
                  )
                  rows, malformed = baseline._load_joined_events(conn, limit=10)  # noqa: PLC2701
              assert rows == []
              assert malformed == 2
          ''', encoding='utf-8')
          PY
      - name: Require the intended RED failures before changing product code
        shell: bash
        run: |
          set -euo pipefail
          set +e
          .venv/bin/python -m pytest -q tests/test_corrective_c1_reliability.py --junitxml="$RUNNER_TEMP/c1-evidence/red.xml" > "$RUNNER_TEMP/c1-evidence/red.log" 2>&1
          result=$?
          set -e
          [[ "$result" == 1 ]]
          .venv/bin/python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'c1-evidence/red.xml').getroot()
          cases = list(root.iter('testcase'))
          failures = [case for case in cases if case.find('failure') is not None]
          assert len(cases) == 6 and len(failures) == 5, 'Unexpected RED result'
          assert not list(root.iter('error')) and not list(root.iter('skipped'))
          expected = ('test_citation_normalization_cannot_exceed_final_json_budget',
                      'test_unhashable_task_classes_are_unknown',
                      'test_invalid_joined_json_is_counted_instead_of_filtered_out')
          assert all(case.attrib['name'].startswith(expected) for case in failures)
          PY
      - name: Apply only the reviewed narrow transformations
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import re
          from pathlib import Path

          def change_function(path: str, name: str, before: str, after: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              match = re.search(r'^def ' + re.escape(name) + r'\(.*?(?=^def |^class |\Z)', text, re.M | re.S)
              if match is None or match.group().count(before) != 1:
                  raise SystemExit(f'Unexpected function body: {path}:{name}')
              replaced = match.group().replace(before, after, 1)
              file.write_text(text[:match.start()] + replaced + text[match.end():], encoding='utf-8')

          change_function(
              'friday/orchestration/current_file_web_comparison.py', '_validate_answer',
              '    return normalized\n',
              '''    # Canonical citation rendering can add bytes after the initial bound.
              # Enforce the same JSON budget on the actual returned representation.
              encoded = len(json.dumps(normalized, ensure_ascii=False).encode("utf-8"))
              if encoded > max_utf8_bytes:
                  raise _AnswerRejected(
                      f"comparison answer exceeds the json budget encoded={encoded} max={max_utf8_bytes}",
                      code="json_budget",
                      encoded=encoded,
                      max_utf8_bytes=max_utf8_bytes,
                  )
              return normalized
          ''',
          )
          change_function(
              'friday/orchestration/supervisor_production_baseline.py', '_safe_task_class',
              '    if value in {\n',
              '    if not isinstance(value, str):\n        return "unknown"\n    if value in {\n',
          )
          change_function(
              'friday/orchestration/supervisor_production_baseline.py', '_load_joined_events',
              'WHERE event_type=? AND json_valid(payload)',
              'WHERE event_type=?',
          )
          PY
          .venv/bin/ruff check --fix --select I tests/test_corrective_c1_reliability.py
          .venv/bin/ruff format tests/test_corrective_c1_reliability.py
          .venv/bin/ruff check friday/orchestration/current_file_web_comparison.py friday/orchestration/supervisor_production_baseline.py tests/test_corrective_c1_reliability.py
          git diff --check
      - name: Require GREEN regressions and affected existing tests
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          tests = [Path('tests/test_corrective_c1_reliability.py')]
          for path in sorted(Path('tests').rglob('test_*.py')):
              if path in tests:
                  continue
              text = path.read_text(encoding='utf-8')
              if any(name in text for name in ('supervisor_production_baseline', 'current_file_web_comparison')):
                  tests.append(path)
          assert len(tests) >= 3, 'Existing affected suites were not found'
          evidence = Path(os.environ['RUNNER_TEMP']) / 'c1-evidence'
          (evidence / 'selected-tests.txt').write_text('\n'.join(map(str, tests)) + '\n')
          with (evidence / 'green.log').open('w') as log:
              subprocess.run(
                  ['.venv/bin/python', '-m', 'pytest', '-q', *map(str, tests),
                   '--junitxml=' + str(evidence / 'green.xml')],
                  stdout=log, stderr=subprocess.STDOUT, check=True,
              )
          PY
      - name: Create a source-only candidate and remove temporary automation
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Friday corrective maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add friday/orchestration/current_file_web_comparison.py friday/orchestration/supervisor_production_baseline.py tests/test_corrective_c1_reliability.py
          git rm .github/workflows/friday-corrective-c1.yml
          if [[ "$(git rev-parse HEAD:.github/workflows/audit-source-snapshot.yml 2>/dev/null || true)" == b52bdf949ba93936ef752bfd659ccc61a70ec490 ]]; then
            git rm .github/workflows/audit-source-snapshot.yml
          fi
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/c1-evidence/candidate.patch"
          git commit -m 'fix(reliability): enforce rendered answer budget and count malformed observations' -m 'C1 source corrections only. Preserve historical S3 witness and existing activation policy. No production deployment or Pandora changes. Behavioral regressions reproduced RED before patching and passed GREEN afterward.'
          candidate_sha="$(git rev-parse HEAD)"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$candidate_sha" > "$RUNNER_TEMP/c1-evidence/candidate-sha.txt"
      - name: Require the canonical change gate before publishing
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          (( $(nproc) >= 4 ))
          (( $(df --output=avail -B1 /var/tmp | tail -n 1) >= 8 * 1024 * 1024 * 1024 ))
          gate_dir="$(mktemp -d /var/tmp/frc1.XXXXXX)"
          trap 'rm -rf -- "$gate_dir"' EXIT
          .venv/bin/python -I -B tools/quality_gate.py \
            --tier change \
            --candidate-sha "${{ steps.candidate.outputs.sha }}" \
            --base-sha "$GITHUB_SHA" \
            --evidence-dir "$gate_dir/evidence" \
            --workers 4 --ui-workers 1
          cp -a "$gate_dir/evidence" "$RUNNER_TEMP/c1-evidence/change-gate"
      - name: Fast-forward main only if nobody advanced it
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" fetch origin main
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD^)" == "$GITHUB_SHA" ]]
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:refs/heads/main
          remote_sha="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" ls-remote origin refs/heads/main | cut -f1)"
          [[ "$remote_sha" == "$(git rev-parse HEAD)" ]]
          printf '%s\n' "$remote_sha" > "$RUNNER_TEMP/c1-evidence/published-main-sha.txt"
      - name: Preserve synthetic validation evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corrective-c1-${{ github.run_id }}
          path: ${{ runner.temp }}/c1-evidence
          if-no-files-found: warn
          retention-days: 7
