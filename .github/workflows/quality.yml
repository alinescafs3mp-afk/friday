name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create development environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade --constraint requirements-dev.lock pip setuptools wheel
          .venv/bin/python -m pip install --no-build-isolation --constraint requirements.lock --constraint requirements-dev.lock -e ".[dev]"

      - name: Install Playwright Chromium
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Run canonical quality gate
        run: .venv/bin/python tools/quality_gate.py
