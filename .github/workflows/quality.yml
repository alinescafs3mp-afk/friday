name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full accepted ancestor SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QUALITY_GATE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.base_sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.4"

      - name: Seal hosted Python and executable directories
        run: |
          set -euo pipefail
          # This step is confined to the disposable GitHub-hosted VM.
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          python_root="${pythonLocation:-}"
          test "$python_root" = /opt/hostedtoolcache/Python/3.14.4/x64
          test -d "$python_root" && test ! -L "$python_root"
          test "$(realpath -- "$python_root")" = "$python_root"
          for directory in /usr/local/sbin /usr/local/bin /usr/sbin /usr/bin; do
            test -d "$directory" && test ! -L "$directory"
            stat --format='before %n uid=%u gid=%g mode=%a' -- "$directory"
            sudo chmod go-w -- "$directory"
            stat --format='after %n uid=%u gid=%g mode=%a' -- "$directory"
          done
          # Preserve file contents, ownership and executability. Do not follow links.
          sudo find -P "$python_root" -xdev -type d -exec chmod go-w -- {} +
          sudo find -P "$python_root" -xdev -type f -exec chmod go-w -- {} +

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"

      - name: Create development environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade --constraint requirements-dev.lock pip setuptools wheel
          .venv/bin/python -m pip install --no-build-isolation --constraint requirements.lock --constraint requirements-dev.lock -e ".[dev,vectors]"

      - name: Install Coding worker prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap apparmor-profiles
          test -x /usr/bin/bwrap
          test -x /usr/bin/prlimit
          # Load only the distribution's restrictive bwrap profile on this disposable VM.
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile" && test ! -L "$profile"
          dpkg-query -S "$profile" | grep -Fx "apparmor-profiles: $profile"
          test -z "$(sudo dpkg --verify apparmor-profiles)"
          test "$(cat /sys/module/apparmor/parameters/enabled)" = Y
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          sudo /usr/sbin/apparmor_parser --replace "$profile"
          # Probe as the ordinary runner, never as root or with shared namespaces.
          profile_stack="$(/usr/bin/timeout 15 /usr/bin/bwrap \
            --unshare-all --unshare-user --uid "$(id -u)" --gid "$(id -g)" \
            --cap-drop ALL --disable-userns --die-with-parent --new-session \
            --ro-bind /usr /usr --ro-bind-try /lib /lib --ro-bind-try /lib64 /lib64 \
            --proc /proc --dev /dev -- /usr/bin/cat /proc/self/attr/current)"
          test "$profile_stack" = "bwrap//&unpriv_bwrap (enforce)"
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1

      - name: Install Playwright Chromium
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Verify hosted runtime trust
        run: |
          set -euo pipefail
          .venv/bin/python -I -B - <<'PYTHON'
          import json
          import os
          import sys
          sys.path.insert(0, os.getcwd())
          from friday.organs.engineer.command.contracts import TrustedPathContract
          from friday.organs.engineer.command.resolve import attest_trusted_path
          from tools import exact_release_evidence
          roots = attest_trusted_path(TrustedPathContract((
              "/usr/local/sbin", "/usr/local/bin", "/usr/sbin", "/usr/bin", "/sbin", "/bin",
          )))
          try:
              bound = exact_release_evidence._open_validation_interpreter()
              try:
                  print(json.dumps({
                      "trusted_path": [root.path for root in roots],
                      "validation_python": str(bound[1]),
                      "bootstrap_file_bindings": len(bound[4]),
                  }))
              finally:
                  for _, _, descriptor, _ in bound[4]:
                      if descriptor >= 0:
                          os.close(descriptor)
                  os.close(bound[0])
          finally:
              for root in roots:
                  os.close(root.dir_fd)
          PYTHON

      - name: Authenticate hosted change capacity
        run: |
          set -euo pipefail
          (( $(nproc) >= 4 ))
          (( $(df --output=avail -B1 /var/tmp | tail -n 1) >= 8 * 1024 * 1024 * 1024 ))

      - name: Run closed synthetic change gate
        run: |
          set -euo pipefail
          umask 077
          candidate_sha="${{ github.sha }}"
          base_sha="$QUALITY_GATE_BASE_SHA"
          evidence_dir="$RUNNER_TEMP/quality-gate-evidence"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ && "$base_sha" != "$candidate_sha" ]]
          git merge-base --is-ancestor "$base_sha" "$candidate_sha"
          install -d -m 0700 "$evidence_dir"
          .venv/bin/python -I -B tools/hosted_quality_service.py \
            --log-path "$RUNNER_TEMP/quality-gate.log" \
            --runner-temp "$RUNNER_TEMP" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --runtime-max-sec 7200 \
            --timeout-stop-sec 6 \
            -- \
            "$PWD/.venv/bin/python" -I -B "$PWD/tools/quality_gate.py" \
            --tier change \
            --candidate-sha "$candidate_sha" \
            --base-sha "$base_sha" \
            --evidence-dir "$evidence_dir" \
            --workers 4 \
            --ui-workers 1

      - name: Upload change-gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-change-${{ github.sha }}
          path: |
            ${{ runner.temp }}/quality-gate-evidence
            ${{ runner.temp }}/quality-gate.log
          if-no-files-found: error
          retention-days: 14
