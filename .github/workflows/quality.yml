name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full accepted ancestor SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QUALITY_GATE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.base_sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.4"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"

      - name: Create development environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade --constraint requirements-dev.lock pip setuptools wheel
          .venv/bin/python -m pip install --no-build-isolation --constraint requirements.lock --constraint requirements-dev.lock -e ".[dev,vectors]"

      - name: Install Playwright Chromium
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Authenticate hosted change capacity
        run: |
          set -euo pipefail
          (( $(nproc) >= 4 ))
          (( $(df --output=avail -B1 /var/tmp | tail -n 1) >= 8 * 1024 * 1024 * 1024 ))

      - name: Run closed synthetic change gate
        run: |
          set -euo pipefail
          umask 077
          candidate_sha="${{ github.sha }}"
          base_sha="$QUALITY_GATE_BASE_SHA"
          evidence_dir="$RUNNER_TEMP/quality-gate-evidence"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ && "$base_sha" != "$candidate_sha" ]]
          git merge-base --is-ancestor "$base_sha" "$candidate_sha"
          install -d -m 0700 "$evidence_dir"
          .venv/bin/python -I -B tools/quality_gate.py \
            --tier change \
            --candidate-sha "$candidate_sha" \
            --base-sha "$base_sha" \
            --evidence-dir "$evidence_dir" \
            --workers 4 \
            --ui-workers 1

      - name: Upload change-gate evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-change-${{ github.sha }}
          path: ${{ runner.temp }}/quality-gate-evidence
          if-no-files-found: error
          retention-days: 14
