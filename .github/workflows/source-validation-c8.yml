name: C8 checked-source transport
on:
  push:
    branches: [main]
    paths: [.github/workflows/source-validation-c8.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: friday-c8-source-validation
  cancel-in-progress: false
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Store ordinary objects from the exact previously tested tree
        env:
          GH_SOURCE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/c8-evidence"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/c8-evidence/transport.log"
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          def git(*args, data=None):
              return subprocess.check_output(['/usr/bin/git', *args], input=data)
          repo = 'alinescafs3mp-afk/friday'
          base = 'ac3d090b1487db3c320ab6af7ad986dbe342b2bf'
          workflow = '.github/workflows/source-validation-c8.yml'
          expected = '579cbfc941beec168f44571a3e42d481d0a0a13c'
          ordinary = 'eebc8569433cb39093896e14cd6b3dca719aa1b6'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'c8-evidence'
          if os.environ['GITHUB_REPOSITORY'] != repo or git('rev-parse', 'HEAD').decode().strip() != os.environ['GITHUB_SHA']:
              raise SystemExit('source identity mismatch')
          git('merge-base', '--is-ancestor', base, 'HEAD')
          git('diff', '--exit-code', base, 'HEAD', '--', '.', ':(exclude)' + workflow)
          headers = {'Authorization': 'Bearer ' + os.environ['GH_SOURCE_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          for blob, size, digest in (
              ('d8e1ee1787ab7632b98b6ea12217fc93481c6172', 8602, '96eae46eb11d8a983c4b8678021a91c9c8239f1233b6cae2b4b378b149e4b4be'),
              ('ca412c2f16d0e04b64e2ddd8df3b07c32f0b0816', 3612, '6e10ae462bd3782906b2d3b95ad5b20ada9d244c7cd70ca6f2e5a57110354b91'),
          ):
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{blob}', headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  value = json.loads(response.read(32768))
              if value.get('encoding') != 'base64' or value.get('size') != size:
                  raise SystemExit('unexpected patch packet')
              patch = base64.b64decode(''.join(value['content'].split()), validate=True)
              if len(patch) != size or hashlib.sha256(patch).hexdigest() != digest:
                  raise SystemExit('patch checksum mismatch')
              git('apply', '--unidiff-zero', '--index', '--check', '-', data=patch)
              git('apply', '--unidiff-zero', '--index', '-', data=patch)
          git('rm', '--', workflow)
          git('diff', '--cached', '--check')
          if git('write-tree').decode().strip() != expected:
              raise SystemExit('candidate differs from tested tree')
          git('config', 'user.name', 'Friday source transport')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'ci: transport exact previously tested C8 source; no new validation')
          git('diff', '--exit-code')
          git('diff', '--cached', '--exit-code')
          git('bundle', 'create', str(out / 'source.bundle'), 'HEAD')
          entries = []
          for path in git('diff', '--name-only', '--no-renames', '-z', base, 'HEAD').decode().split('\0'):
              if not path or path.startswith('.github/'):
                  continue
              row = git('ls-tree', 'HEAD', '--', path).decode().strip()
              if not row.startswith('100644 blob '):
                  raise SystemExit('unexpected source file mode')
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'content': git('show', 'HEAD:' + path).decode()})
          if len(entries) != 5:
              raise SystemExit('unexpected ordinary source set')
          payload = json.dumps({'base_tree': git('rev-parse', base + '^{tree}').decode().strip(), 'tree': entries}, ensure_ascii=False).encode()
          request = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/trees', data=payload, method='POST', headers=headers)
          with urllib.request.urlopen(request, timeout=90) as response:
              result = json.load(response)
          if result.get('sha') != ordinary:
              raise SystemExit('stored ordinary tree mismatch')
          receipt = {'trigger': os.environ['GITHUB_SHA'], 'candidate': git('rev-parse', 'HEAD').decode().strip(), 'source_tree': expected, 'stored_ordinary_tree': ordinary, 'prior_validation_run': 34055827454, 'tests_run_in_this_transport': False, 'branch_updated': False, 'production_deployed': False}
          (out / 'source-tree.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          checksums = []
          for name in ('source.bundle', 'source-tree.json'):
              with (out / name).open('rb') as stream:
                  checksums.append(hashlib.file_digest(stream, 'sha256').hexdigest() + '  ' + name + '\n')
          (out / 'SHA256SUMS').write_text(''.join(checksums))
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Preserve source transfer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c8-source-${{ github.sha }}
          path: ${{ runner.temp }}/c8-evidence
          if-no-files-found: error
          retention-days: 7
