name: Source transfer

on:
  push:
    branches: [main]
    paths: [.github/workflows/source-transfer.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export committed objects only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/source-transfer"
          git bundle create "$RUNNER_TEMP/source-transfer/source.bundle" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/source-transfer/commit.txt"
          cd "$RUNNER_TEMP/source-transfer"
          sha256sum source.bundle > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-transfer-${{ github.sha }}
          path: ${{ runner.temp }}/source-transfer
          if-no-files-found: error
          retention-days: 1
