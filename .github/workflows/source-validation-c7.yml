name: C7 source validation
on:
  push:
    branches: [main]
    paths: [.github/workflows/source-validation-c7.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: friday-c7-source-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Reconstruct exact source bytes without branch publication
        env:
          GH_SOURCE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/c7-evidence"
          python - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import subprocess
          import urllib.request

          def git(*args, data=None):
              return subprocess.check_output(['/usr/bin/git', *args], input=data)

          repo = 'alinescafs3mp-afk/friday'
          base = 'c976ff5ff712a8c13ab5880bc3f9fb3242cdec88'
          workflow = '.github/workflows/source-validation-c7.yml'
          expected = '8e34e49a5e2dbd23667147f2c2890eb359cc062c'
          blob = '277d223598b72a5e6fa5bda54b076ad3c72c98d1'
          if os.environ['GITHUB_REPOSITORY'] != repo or git('rev-parse', 'HEAD').decode().strip() != os.environ['GITHUB_SHA']:
              raise SystemExit('unexpected source identity')
          git('merge-base', '--is-ancestor', base, 'HEAD')
          git('diff', '--exit-code', base, 'HEAD', '--', '.', ':(exclude)' + workflow)
          git('diff', '--exit-code')
          git('diff', '--cached', '--exit-code')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/git/blobs/{blob}',
              headers={'Authorization': 'Bearer ' + os.environ['GH_SOURCE_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              value = json.loads(response.read(49153))
          if value.get('encoding') != 'base64' or value.get('size') != 13336:
              raise SystemExit('invalid source packet')
          packed = base64.b64decode(''.join(value['content'].split()), validate=True)
          if len(packed) != 13336 or hashlib.sha256(packed).hexdigest() != '3a0ae6ec7a3aa7348b9ad0c65a08dd9a59822fca0d165115c4c33ec15e7c2e60':
              raise SystemExit('source packet identity mismatch')
          decoder = lzma.LZMADecompressor(memlimit=67108864)
          patch = decoder.decompress(packed, max_length=51260)
          if not decoder.eof or decoder.unused_data or len(patch) != 51259 or hashlib.sha256(patch).hexdigest() != '75434acecdf89947fda4baff30da5b135ee4c3b801bb745da74259c31d75d860':
              raise SystemExit('patch integrity mismatch')
          git('apply', '--index', '--check', '-', data=patch)
          git('apply', '--index', '-', data=patch)
          git('rm', '--', workflow)
          git('diff', '--cached', '--check')
          if git('write-tree').decode().strip() != expected:
              raise SystemExit('candidate tree mismatch')
          git('config', 'user.name', 'Friday source validation')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'feat(coding): exact C7 author-tested candidate; not a release')
          print('Exact C7 candidate tree:', expected)
          PY
      - name: Install locked project test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade --constraint requirements-dev.lock pip setuptools wheel
          .venv/bin/python -m pip install --no-build-isolation --constraint requirements.lock --constraint requirements-dev.lock -e '.[dev,vectors]'
      - name: Check source and affected revision and turn-boundary contracts
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check friday friday_host_agent friday_package_broker deploy/host-control tests tools
          .venv/bin/python -m mypy friday friday_host_agent friday_package_broker
          .venv/bin/python -m bandit -q -r friday/organs/coding -lll
          .venv/bin/python -m pytest -q -n 4 \
            tests/test_coding_model_edit.py \
            tests/test_coding_revision_edit.py \
            tests/test_coding_revision_continuity.py \
            tests/test_coding_mode_surface.py \
            tests/test_coding_extract_transaction.py \
            tests/test_coding_result_export.py \
            tests/test_generated_file_delivery.py \
            tests/test_operation_result_carrier.py \
            tests/test_orchestration_import_boundaries.py \
            tests/test_quality_gate_inventory.py \
            tests/test_turn_context.py \
            tests/test_turn_context_adversarial.py \
            tests/test_turn_context_effect_guard.py \
            tests/test_turn_context_ingestion_guard.py \
            tests/test_turn_context_ingress.py \
            tests/test_turn_context_outer_supervisor_propagation.py \
            tests/test_turn_context_publication_guard.py \
            tests/test_turn_context_router_supervisor_propagation.py \
            tests/test_turn_context_runtime.py \
            tests/test_llm_runtime.py \
            tests/test_v12_router_pending_durable.py \
            --junitxml="$RUNNER_TEMP/c7-evidence/focused.xml"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'c7-evidence/focused.xml').getroot()
          cases = list(root.iter('testcase'))
          if len(cases) != 546 or any(child.tag in {'skipped', 'failure', 'error'} for case in cases for child in case):
              raise SystemExit('missing or nonpassing focused source cases')
          print('All 546 cases passed. Live model quality, native and independent acceptance remain separate.')
          PY
      - name: Store checked source objects only, never move a branch or deploy
        env:
          GH_TREE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['/usr/bin/git', *args]).decode('utf-8')

          expected = '8e34e49a5e2dbd23667147f2c2890eb359cc062c'
          if git('rev-parse', 'HEAD^{tree}').strip() != expected:
              raise SystemExit('checked tree changed')
          git('diff', '--exit-code')
          git('diff', '--cached', '--exit-code')
          trigger = os.environ['GITHUB_SHA']
          entries = []
          for path in git('diff', '--name-only', '--no-renames', '-z', trigger, 'HEAD').split('\0'):
              if not path:
                  continue
              row = git('ls-tree', 'HEAD', '--', path).strip()
              entry = {'path': path, 'mode': '100644', 'type': 'blob'}
              if row:
                  if not row.startswith('100644 blob '):
                      raise SystemExit('unexpected source mode')
                  entry['content'] = git('show', 'HEAD:' + path)
              else:
                  entry['sha'] = None
              entries.append(entry)
          payload = json.dumps({'base_tree': git('rev-parse', trigger + '^{tree}').strip(), 'tree': entries}, ensure_ascii=False).encode()
          request = urllib.request.Request(
              'https://api.github.com/repos/alinescafs3mp-afk/friday/git/trees',
              data=payload, method='POST',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TREE_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'},
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              value = json.load(response)
          if value.get('sha') != expected:
              raise SystemExit('stored tree mismatch')
          out = Path(os.environ['RUNNER_TEMP']) / 'c7-evidence'
          receipt = {'trigger': trigger, 'candidate': git('rev-parse', 'HEAD').strip(), 'source_tree': expected, 'focused_cases_passed': 546, 'live_model_tested': False, 'canonical_native_gate': 'not_attested', 'independent_review': 'pending', 'branch_updated': False, 'production_deployed': False}
          (out / 'source-tree.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          git('bundle', 'create', str(out / 'source.bundle'), 'HEAD')
          with (out / 'source.tar').open('wb') as stream:
              subprocess.run(['/usr/bin/git', 'archive', '--format=tar', 'HEAD'], stdout=stream, check=True)
          sums = []
          for name in ('source.bundle', 'source.tar', 'source-tree.json', 'focused.xml'):
              with (out / name).open('rb') as stream:
                  sums.append(hashlib.file_digest(stream, 'sha256').hexdigest() + '  ' + name + '\n')
          (out / 'SHA256SUMS').write_text(''.join(sums))
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Preserve source and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c7-source-${{ github.sha }}
          path: ${{ runner.temp }}/c7-evidence
          if-no-files-found: warn
          retention-days: 7
