name: C1 source validation

on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-source-snapshot.yml, .github/c1-followup.patch.xz]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: friday-c1-source-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.4'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Provision the existing native Coding test prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y bubblewrap
      - name: Install the locked project toolchain
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade --constraint requirements-dev.lock pip setuptools wheel
          .venv/bin/python -m pip install --no-build-isolation --constraint requirements.lock --constraint requirements-dev.lock -e '.[dev,vectors]'
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Reconstruct the exact locally reviewed source tree, without publishing it
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64
          import hashlib
          import lzma
          import os
          import subprocess
          from pathlib import Path

          base = '46a32f355c185f5d99a30f3ed0594f3b145688a8'
          expected_tree = 'd4258fabb3d6694446e296c1021ef2ec57cb33b4'
          temporary = ('.github/workflows/audit-source-snapshot.yml', '.github/c1-followup.patch.xz')
          def git(*args, data=None):
              return subprocess.check_output(['/usr/bin/git', *args], input=data)
          if os.environ['GITHUB_REPOSITORY'] != 'alinescafs3mp-afk/friday':
              raise SystemExit('unexpected repository')
          if git('rev-parse', 'HEAD').decode().strip() != os.environ['GITHUB_SHA']:
              raise SystemExit('trigger identity mismatch')
          git('merge-base', '--is-ancestor', base, 'HEAD')
          git('diff', '--exit-code', base, 'HEAD', '--', '.', *(':(exclude)' + p for p in temporary))
          git('diff', '--exit-code')
          git('diff', '--cached', '--exit-code')
          previous = git('show', '2143388e0c23a46623713e0e572313f254ccb0f7:.github/audit-c1.patch.xz.b64')
          packets = (
              (base64.b64decode(previous.strip(), validate=True), 82004, '57e4d7087b271e4a4dc786d7932f265c7cb15d7b92089913d191dff99692900e'),
              (Path(temporary[1]).read_bytes(), 6837, '0b80278b77cddc517b58b222ccb90186773db87c7f403d76514b6c1683a91981'),
          )
          for packed, size, digest in packets:
              decoder = lzma.LZMADecompressor()
              patch = decoder.decompress(packed, max_length=size + 1)
              if not decoder.eof or decoder.unused_data or len(patch) != size or hashlib.sha256(patch).hexdigest() != digest:
                  raise SystemExit('patch integrity mismatch')
              git('apply', '--index', '--check', '--unidiff-zero', '-', data=patch)
              git('apply', '--index', '--unidiff-zero', '-', data=patch)
          git('rm', '--', *temporary)
          git('diff', '--cached', '--check')
          if git('write-tree').decode().strip() != expected_tree:
              raise SystemExit('candidate tree mismatch')
          git('config', 'user.name', 'Friday source validation')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'fix(reliability): C1 source candidate; no production activation')
          print('Exact candidate tree:', expected_tree)
          PY
      - name: Run the unchanged canonical hosted change gate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/c1-evidence"
          .venv/bin/python -I -B tools/quality_gate.py \
            --tier change \
            --candidate-sha "$(git rev-parse HEAD)" \
            --base-sha 46a32f355c185f5d99a30f3ed0594f3b145688a8 \
            --evidence-dir "$RUNNER_TEMP/c1-evidence" \
            --workers 4 --ui-workers 1
      - name: Upload only an unreferenced validated Git tree, never move main
        env:
          GH_TREE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['/usr/bin/git', *args]).decode('utf-8')
          expected = 'd4258fabb3d6694446e296c1021ef2ec57cb33b4'
          if git('rev-parse', 'HEAD^{tree}').strip() != expected:
              raise SystemExit('validated tree changed')
          git('diff', '--exit-code')
          git('diff', '--cached', '--exit-code')
          trigger = os.environ['GITHUB_SHA']
          entries = []
          for path in git('diff', '--name-only', '--no-renames', '-z', trigger, 'HEAD').split('\0'):
              if not path:
                  continue
              row = git('ls-tree', 'HEAD', '--', path).strip()
              entry = {'path': path, 'mode': '100644', 'type': 'blob'}
              if row:
                  if not row.startswith('100644 blob '):
                      raise SystemExit('unexpected object mode')
                  entry['content'] = git('show', 'HEAD:' + path)
              else:
                  entry['sha'] = None
              entries.append(entry)
          payload = json.dumps({'base_tree': git('rev-parse', trigger + '^{tree}').strip(), 'tree': entries}, ensure_ascii=False).encode()
          request = urllib.request.Request(
              'https://api.github.com/repos/alinescafs3mp-afk/friday/git/trees',
              data=payload, method='POST',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TREE_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'},
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              result = json.load(response)
          if result.get('sha') != expected:
              raise SystemExit('uploaded tree mismatch')
          receipt = {'workflow_commit': trigger, 'candidate_commit': git('rev-parse', 'HEAD').strip(), 'tree_sha': expected, 'gate': 'hosted change passed', 'production_deployed': False, 'independent_review': 'pending'}
          out = Path(os.environ['RUNNER_TEMP']) / 'c1-evidence' / 'tree-upload.json'
          out.write_text(json.dumps(receipt, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Preserve validation evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c1-validation-${{ github.sha }}
          path: ${{ runner.temp }}/c1-evidence
          if-no-files-found: warn
          retention-days: 3
