name: Audit source snapshot

on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-source-snapshot.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
      - name: Export tracked source and preserve the previous unintegrated patch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          out="$RUNNER_TEMP/audit-source"
          install -d -m 0700 "$out"
          git archive --format=tar HEAD > "$out/source.tar"
          git bundle create "$out/source.bundle" HEAD
          git rev-parse HEAD > "$out/commit.txt"
          git rev-parse HEAD^{tree} > "$out/tree.txt"
          git show 2143388e0c23a46623713e0e572313f254ccb0f7:.github/audit-c1.patch.xz.b64 > "$out/previous-c1.patch.xz.b64"
          python -m pip download --only-binary=:all: \
            --constraint requirements.lock --constraint requirements-dev.lock \
            --dest "$out/wheels" \
            beautifulsoup4 cryptography fastapi httpcore httpx lxml mcp \
            openpyxl Pillow pydantic pypdf pypdfium2 python-docx \
            python-multipart python-pptx py7zr pyzipper rarfile reportlab \
            striprtf 'uvicorn[standard]' websockets zstandard numpy \
            bandit build mypy playwright pytest pytest-asyncio pytest-cov \
            pytest-xdist ruff wheel setuptools
          cd "$out"
          sha256sum source.tar source.bundle previous-c1.patch.xz.b64 wheels/* > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-source-${{ github.sha }}
          path: ${{ runner.temp }}/audit-source
          if-no-files-found: error
          retention-days: 1
