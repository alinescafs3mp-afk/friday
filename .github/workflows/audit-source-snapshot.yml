name: Audit source snapshot

on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-source-snapshot.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"
      - name: Export tracked public source and locked validation tools only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/audit-source"
          git archive --format=tar HEAD > "$RUNNER_TEMP/audit-source/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/audit-source/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/audit-source/tree.txt"
          python -m pip download --only-binary=:all: \
            --constraint requirements.lock --constraint requirements-dev.lock \
            --dest "$RUNNER_TEMP/audit-source/wheels" \
            ruff mcp pytest-xdist build mypy
          cd "$RUNNER_TEMP/audit-source"
          sha256sum source.tar wheels/* > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-source-${{ github.sha }}
          path: ${{ runner.temp }}/audit-source
          if-no-files-found: error
          retention-days: 1
