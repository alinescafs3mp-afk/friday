[project]
name = "friday"
version = "0.207.90"
description = "Local-first personal Knowledge Operating System with a provenance-first knowledge graph."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14,<5",
    # Ed25519 broker response/receipt signatures are a production trust boundary,
    # so cryptography is a direct dependency rather than an accidental transitive.
    # Ubuntu 24.04 LTS ships 41.0.7 with security backports.  That release
    # supports Python 3.11+ and every Ed25519/raw-serialization API used by the
    # broker; keep the regular lock newer without making the offline host venv
    # metadata-unsatisfied.
    "cryptography>=41.0.7,<51",
    "fastapi>=0.128,<1",
    "httpcore>=1,<2",
    "httpx>=0.28,<1",
    "lxml>=6,<7",
    # Standard connector bus for local/remote tools.  Keep the major pinned:
    # MCP v2 is the first stable line for the 2026-07-28 stateless protocol.
    "mcp>=2,<3",
    "openpyxl>=3.1,<4",
    "Pillow>=11,<13",
    "pydantic>=2.13,<3",
    "pypdf>=5.9,<7",
    # In-process page renderer for scan-only PDFs.  pypdf extracts text and
    # embedded streams but cannot render a page's visible composition for OCR.
    "pypdfium2>=5.12.1,<6",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "python-pptx>=1.0,<2",
    "py7zr>=1.0,<2",
    # stdlib zipfile decrypts only legacy ZipCrypto.  This also reads the
    # WinZip AES archives produced by current desktop archivers, in memory.
    "pyzipper>=0.4,<0.5",
    "rarfile>=4.2,<5",
    # Сборка PDF-отчётов. Кириллица требует внешнего шрифта — см. friday/reports.
    "reportlab>=4.2,<6",
    "striprtf>=0.0.29,<1",
    "uvicorn[standard]>=0.34,<1",
    "websockets>=15,<17",
    "zstandard>=0.23,<1",
]

[project.optional-dependencies]
# The single deliberate exception to "zero new dependencies": local speech-to-text
# and text-to-speech for voice notes and spoken replies. Both run entirely offline
# (CTranslate2 for STT, onnxruntime for TTS); gated behind FRIDAY_WHISPER_ENABLED /
# FRIDAY_TTS_ENABLED and lazy-imported, so the core runs without either installed.
# piper-tts pulls in onnxruntime + pathvalidate, both lightweight; it reuses the
# `av` (PyAV) package faster-whisper already brings in transitively to encode
# speech to OGG/Opus for Telegram voice messages, so this adds no new heavy
# dependency category on top of the existing STT exception.
voice = [
    "faster-whisper>=1.2,<2",
    "piper-tts>=1.6,<2",
]
# Accelerates corpus-wide dense recall: the pure-Python cosine scan becomes one
# BLAS matmul. Lazy-imported with a pure-Python fallback, so the core runs without
# it; install `friday[vectors]` when semantic search over a large corpus is used.
vectors = [
    "numpy>=1.26,<3",
]
dev = [
    "bandit>=1.8,<2",
    "build>=1.2,<2",
    "mypy>=1.15,<2",
    # Admin UI tests are release tests, not optional skips.  The browser binary
    # is installed explicitly by the quality gate/CI preflight.
    "playwright>=1.55,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=7,<8",
    # Параллельный прогон. Замерено 2026-08-03 на этой машине: гейт из 2963
    # тестов идёт 229 с в одном процессе и 96 с на двенадцати, при 24 ядрах и
    # нулевой нагрузке на них всё остальное время. Ни один тест от параллельности
    # не отказал — это и было главной неизвестностью.
    "pytest-xdist>=3,<4",
    "ruff>=0.8,<1",
    # Required by the declared build backend and by the clean-wheel release phase.
    "wheel>=0.45,<1",
]

[project.scripts]
friday = "friday.cli:main"
# Прежнее имя команды остаётся рабочим: у владельца оно в systemd-юнитах, в
# скриптах и в мышечной памяти. Переименование проекта не повод ломать чужие
# запуски — «ex codename Jericho».
jericho = "friday.cli:main"
friday-host-agent = "friday_host_agent.__main__:main"
friday-package-broker = "friday_package_broker.__main__:main"

[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Every non-Python file shipped by Friday is declared explicitly below.  Keeping
# implicit manifest discovery disabled also makes wheel builds independent of a
# stale ``*.egg-info/SOURCES.txt`` left by editable installs or packaging tools.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["friday*"]

[tool.setuptools.package-data]
"friday.admin_ui" = ["static/*"]
"friday.organs.engineer" = ["ghidra_scripts/*.java"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# `-n 12` — параллельный прогон умолчанием. Замерено 2026-08-03 на 24 ядрах:
#
#     один процесс   229 с
#     12 воркеров     96 с
#     24 воркера      95 с
#
# Двенадцать и двадцать четыре дают одно и то же: упирается уже не в процессор, а
# в хвост из нескольких самых долгих тестов — пока они идут, остальные воркеры
# простаивают. Поэтому берём половину ядер, а не все: выигрыш тот же, а машина
# остаётся отзывчивой для живого экземпляра, который на ней же и работает.
#
# Ни один тест от параллельности не отказал — это была главная неизвестность.
# Отключить на один прогон: `-p no:xdist` или `-n 0`.
addopts = "-ra -n 12"
asyncio_mode = "auto"

[tool.mypy]

# Voice and vector acceleration are deliberately optional, lazy imports.  The
# canonical CI environment installs ``.[dev,vectors]``; voice remains optional,
# and these lazy-import boundaries stay permissive for core-only installations.
[[tool.mypy.overrides]]
module = ["av", "faster_whisper", "numpy", "piper", "piper.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py311"
# Exact pinned SGLang 0.5.17 source plus upstream PR #35830. Its byte hash is
# runtime-profile identity, so local formatting or modernization is forbidden.
extend-exclude = ["deploy/secondary-brain/windows-sglang/runtime/sampler.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "UP042"]
