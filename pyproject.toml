[project]
name = "jericho"
version = "0.88.0"
description = "Local-first personal Knowledge Operating System with a provenance-first knowledge graph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14,<5",
    "fastapi>=0.128,<1",
    "httpcore>=1,<2",
    "httpx>=0.28,<1",
    "lxml>=6,<7",
    "openpyxl>=3.1,<4",
    "Pillow>=11,<13",
    "pydantic>=2.13,<3",
    "pypdf>=5.9,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "python-pptx>=1.0,<2",
    "py7zr>=1.0,<2",
    "rarfile>=4.2,<5",
    "striprtf>=0.0.29,<1",
    "uvicorn[standard]>=0.34,<1",
    "websockets>=15,<17",
    "zstandard>=0.23,<1",
]

[project.optional-dependencies]
# The single deliberate exception to "zero new dependencies": local speech-to-text
# for voice notes. Runs entirely offline (CTranslate2); gated behind
# JERICHO_WHISPER_ENABLED and lazy-imported, so the core runs without it installed.
voice = [
    "faster-whisper>=1.2,<2",
]
# Accelerates corpus-wide dense recall: the pure-Python cosine scan becomes one
# BLAS matmul. Lazy-imported with a pure-Python fallback, so the core runs without
# it; install `jericho[vectors]` when semantic search over a large corpus is used.
vectors = [
    "numpy>=1.26,<3",
]
dev = [
    "bandit>=1.8,<2",
    "build>=1.2,<2",
    "mypy>=1.15,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.8,<1",
]

[project.scripts]
jericho = "jericho.cli:main"

[build-system]
requires = ["setuptools>=75", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["jericho*"]

[tool.setuptools.package-data]
"jericho.admin_ui" = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "UP042"]
